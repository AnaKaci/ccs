<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Transparent CCS logo; the SVG switches to white letters when the browser is in dark mode. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CCS offers comprehensive IT solutions in Albania, including networking, infrastructure, security, support, and shop products."
    />
    <title>C.C.S</title>
  </head>
  <body>
    <script>
      // Set theme before React starts, preventing a flash on load. Light is the default;
      // dark only applies when the visitor picked it with the toggle.
      try {
        document.body.classList.toggle('dark-mode', localStorage.getItem('ccs-theme') === 'dark');
      } catch {
        document.body.classList.remove('dark-mode');
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
